<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6ef">
  <meta name="description" content="Turas — your private journey away from drink. All data stays on your device.">
  <title>Turas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>
    <button id="sos-fab" class="sos-fab hidden" aria-label="SOS — I have a craving">SOS</button>
    <nav id="tabbar" class="tabbar hidden" aria-label="Main navigation">
      <a href="#/home" data-tab="home">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10"/></svg>
        <span>Home</span></a>
      <a href="#/log" data-tab="log" class="hidden">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 4.5l3 3L8 19l-4 1 1-4L16.5 4.5z"/></svg>
        <span>Log</span></a>
      <a href="#/triggers" data-tab="triggers">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5.5 13.5h5L10.5 21 18.5 10h-5L13 3z"/></svg>
        <span>Triggers</span></a>
      <a href="#/progress" data-tab="progress">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8L12 3.5z"/></svg>
        <span>Progress</span></a>
      <a href="#/settings" data-tab="settings">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9"/><circle cx="15" cy="7.5" r="2.2"/><circle cx="9" cy="16.5" r="2.2"/></svg>
        <span>Settings</span></a>
    </nav>
  </div>
  <div id="toast-root"></div>
  <canvas id="confetti-canvas"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
